# ERakshak — local orchestration. Core = api + dashboard.
# Postgres is included but optional (prototype runs in-memory); enable DATABASE_URL to use it.
services:
  api:
    build: .
    command: uvicorn backend.app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Passed through from .env, with NO fallback value on purpose. Unset, the API
    # generates a random password per boot and logs it once; a `:-analyst` default
    # here would silently replace that with a known credential, which is worse than
    # having none. Recover a generated password with:
    #     docker compose logs api | grep "generated a random"
    environment:
      ERAKSHAK_JWT_SECRET: ${ERAKSHAK_JWT_SECRET:-}
      ERAKSHAK_ANALYST_PASSWORD: ${ERAKSHAK_ANALYST_PASSWORD:-}
      ERAKSHAK_ADMIN_PASSWORD: ${ERAKSHAK_ADMIN_PASSWORD:-}
      # Natural-language query. Absent, /v1/query falls back to the offline
      # rule-based engine — the API never hard-depends on network access.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Upload limits. Real case folders run to hundreds of files, so the
      # library defaults are low for anything but a demo dataset.
      ERAKSHAK_MAX_UPLOAD_FILES: ${ERAKSHAK_MAX_UPLOAD_FILES:-200}
      ERAKSHAK_MAX_UPLOAD_MB: ${ERAKSHAK_MAX_UPLOAD_MB:-256}
    volumes:
      - ./datasets:/app/datasets
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    build: .
    command: streamlit run backend/app/dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./datasets:/app/datasets
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional relational store (scale-triggered). Not required for the prototype.
