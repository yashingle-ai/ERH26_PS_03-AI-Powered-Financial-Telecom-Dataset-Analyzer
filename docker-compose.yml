# ERakshak — local orchestration. Core = api + dashboard.
# Postgres is included but optional (prototype runs in-memory); enable DATABASE_URL to use it.
services:
  api:
    build: .
    command: uvicorn backend.app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Inject the whole of .env, rather than naming variables one at a time.
    #
    # Compose reads .env for *substitution* but does not pass it to containers, so
    # an enumerated `environment:` block silently ignores anything not listed —
    # ERAKSHAK_TOKEN_TTL_MIN was set in .env and had no effect for exactly this
    # reason. Every new setting would have to be added in two places, and
    # forgetting the second fails quietly. See .env.example for the variables.
    #
    # Nothing is defaulted here on purpose: unset, the API generates a random
    # password per boot and logs it once. A `:-analyst` fallback would replace
    # that with a known credential, which is worse than having none. Recover it
    # with:  docker compose logs api | grep "generated a random"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./datasets:/app/datasets
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    build: .
    command: streamlit run backend/app/dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    env_file:                      # same settings as the API — see the note above
      - path: .env
        required: false
    volumes:
      - ./datasets:/app/datasets
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional relational store (scale-triggered). Not required for the prototype.
