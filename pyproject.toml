[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "datasets", "data", "research", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]      # pycodestyle, pyflakes, isort
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints legitimately set sys.path / call setup before importing app modules.
"backend/app/dashboard/app.py" = ["E402"]
"backend/app/api/main.py" = ["E402"]
"scripts/run_pipeline.py" = ["E402"]
"backend/tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
